<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ef">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; object-src 'none';">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Contact Us | Nadine Baghdadi Art Gallery</title>
  <link rel="icon" href="assets/images/logo-badge.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Cairo:wght@300;400;500;600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>

        <!-- Hana Bahaa Authentic Luxury Header -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <nav class="header-nav-left" aria-label="Main Navigation">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="gallery.html" data-i18n="nav_gallery">Gallery</a>
        <a href="about.html" data-i18n="nav_about">About</a>
        <a href="contact.html" class="active" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="header-center">
        <a href="index.html" class="header-brand" aria-label="Nadine Baghdadi Home">
          <img src="assets/images/logo-badge.jpg" alt="Nadine Baghdadi Logo" class="header-brand-logo">
          <span class="brand-signature">Nadine Baghdadi</span>
        </a>
      </div>
      <div class="header-right">
        <button class="lang-toggle-btn" id="langToggleBtn" aria-label="Change Language">
          <i class="fa-solid fa-globe"></i> عربي
        </button>
      </div>
    </div>
  </header>

  <!-- Main Contact Canvas (Exact 2.svg with Nadine Baghdadi Logo & Text) -->
  <main class="contact-container">
    <div class="contact-layout">
      
      <!-- Left: Logo + Top Brand + Headline -->
      <div class="contact-left">
        <header class="contact-brand">
          <a href="index.html" style="display: flex; align-items: center; gap: 1rem;">
            <img src="assets/images/logo-badge.jpg" alt="Nadine Baghdadi Logo" class="brand-logo-circle" style="width: 60px; height: 60px;">
            <div class="contact-brand-title">
              <span data-i18n="brand_title_1">NADINE BAGHDADI</span>
              <span data-i18n="brand_title_2">ART GALLERY</span>
            </div>
          </a>
        </header>

        <h1 class="contact-headline" data-i18n="contact_headline">
          Create with Us
        </h1>
      </div>

      <!-- Right: Contact Information -->
      <div class="contact-right">
        <div class="contact-field">
          <span class="contact-field-title" data-i18n="contact_addr_title">LOCATION</span>
          <p class="contact-field-value" data-i18n="contact_addr_val">Egypt</p>
        </div>

        <div class="contact-field">
          <span class="contact-field-title" data-i18n="contact_phone_title">PHONE NUMBER</span>
          <p class="contact-field-value">
            <a href="tel:01115007653" dir="ltr">01115007653</a>
          </p>
        </div>

        <div class="contact-field">
          <span class="contact-field-title" data-i18n="contact_insta_title">INSTAGRAM</span>
          <p class="contact-field-value">
            <a href="https://www.instagram.com/art.by_nadine?rpxt=dWVsN3E3bGFweHc4" target="_blank" rel="noopener noreferrer">@art.by_nadine</a>
          </p>
        </div>
      </div>

    </div>
  </main>

  <!-- Luxury Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-brand">
        <img src="assets/images/logo-badge.jpg" alt="Nadine Baghdadi" class="footer-logo">
        <h3 data-i18n="footer_brand">NADINE BAGHDADI</h3>
      </div>
      <div class="footer-links">
        <a href="gallery.html" data-i18n="nav_gallery">Gallery</a>
        <a href="about.html" data-i18n="nav_about">About</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </div>
      <div class="footer-social">
        <a href="https://www.instagram.com/art.by_nadine?rpxt=dWVsN3E3bGFweHc4" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 Nadine Baghdadi. All rights reserved.
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
